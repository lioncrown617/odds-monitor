<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>香港賽馬監察</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--sub:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;--hot:#ff4444;--up:#3fb950;--diluted:#8b949e;--warm:#e3b341}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:SF Pro,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;font-weight:700;color:var(--blue);white-space:nowrap}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px}
button{padding:5px 14px;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
#btnStart{background:var(--green);color:#000}
#btnStop{background:var(--red);color:#fff}
#status{font-size:11px;color:var(--sub)}
#indicator{font-size:11px;padding:2px 8px;border-radius:10px;background:#1c2a1c;color:var(--green);border:1px solid var(--green)}
#tabs{display:flex;gap:2px;padding:8px 16px 0;background:var(--panel);border-bottom:1px solid var(--border)}
.tab{padding:6px 16px;border-radius:4px 4px 0 0;cursor:pointer;color:var(--sub);font-size:12px}
.tab.active{background:var(--bg);color:var(--text);font-weight:600}
#content{padding:12px 16px}
.race-line,.pool-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:13px;line-height:1.5}
.race-line .strong{font-weight:700;color:var(--text)}
.pool-line{background:transparent;border:none;padding:0}
.pool-line .blue{color:var(--blue);font-weight:700}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--panel);color:var(--sub);padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left}
td{padding:5px 8px;border-bottom:1px solid #1c2128;text-align:right;white-space:nowrap;vertical-align:middle}
td.left{text-align:left}
tr:hover td{background:#1c2128}
.top-panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:10px}
.top-panel,.qflow-box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px}
.top-panel h3,.qflow-box h3{font-size:12px;color:var(--sub);margin-bottom:8px}
.top-row,.qflow-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1c2128;font-size:12px}
.top-row:last-child,.qflow-item:last-child{border-bottom:none}
.top-no{font-weight:700;color:var(--blue);width:20px}.top-name{flex:1;padding:0 6px}.top-score{font-weight:700;color:var(--hot)}
.qflow-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section-title{margin:10px 0 8px;font-weight:700;color:var(--text)}
.win-big{font-weight:700}
</style>
</head>
<body>
<header>
  <h1>香港賽馬監察</h1>
  <div class="ctrl">
    <input id="iDate" type="date" style="width:130px" />
    <select id="iVenue">
      <option value="ST">ST</option><option value="HV">HV</option><option value="S1">S1</option><option value="S2">S2</option><option value="S3">S3</option><option value="S4">S4</option>
    </select>
    <input id="iRace" type="number" value="1" style="width:55px" />
    <button id="btnStart" onclick="startMonitor()">開始</button>
    <button id="btnStop" onclick="stopMonitor()" disabled>停止</button>
    <button onclick="location.href='/download_log'" style="background:#30363d;color:var(--text)">Log</button>
  </div>
  <span id="indicator">REST</span>
  <span id="status">準備中</span>
</header>

<div id="tabs">
  <div class="tab active" onclick="showTab('main',this)">主頁</div>
  <div class="tab" onclick="showTab('top',this)">熱門</div>
  <div class="tab" onclick="showTab('qin',this)">Q/QP 流向</div>
</div>

<div id="content">
  <div id="race-info" class="race-line"></div>
  <div id="pool-bar" class="pool-line"></div>

  <div id="tab-main">
    <div class="section-title">主頁數據</div>
    <div class="top-panels" style="margin-bottom:10px">
      <div class="top-panel"><h3>WIN 大注</h3><div id="top-win"></div></div>
      <div class="top-panel"><h3>SMS</h3><div id="top-sms-main"></div></div>
      <div class="top-panel"><h3>ACC</h3><div id="top-acc-main"></div></div>
    </div>
    <div class="qflow-wrap" style="margin-bottom:10px">
      <div class="qflow-box"><h3>連贏 (QIN) 大注流入</h3><div id="qin-big"></div></div>
      <div class="qflow-box"><h3>位置Q (QPL) 大注流入</h3><div id="qpl-big"></div></div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>馬號</th><th>馬名</th><th>檔</th><th>騎師</th><th>練馬師</th><th>賠率</th><th>位置</th><th>基準</th><th>投注</th><th>警示</th></tr></thead>
        <tbody id="main-body"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-top" style="display:none">
    <div class="top-panels">
      <div class="top-panel"><h3>SMS</h3><div id="top-sms"></div></div>
      <div class="top-panel"><h3>ACC</h3><div id="top-acc"></div></div>
    </div>
  </div>

  <div id="tab-qin" style="display:none">
    <div class="qflow-wrap">
      <div class="qflow-box"><h3>QIN</h3><div id="qin-r2" style="margin-bottom:6px"></div><div id="qin-o2" style="margin-bottom:6px"></div><div id="qin-y2"></div></div>
      <div class="qflow-box"><h3>QPL</h3><div id="qpl-r2" style="margin-bottom:6px"></div><div id="qpl-o2" style="margin-bottom:6px"></div><div id="qpl-y2"></div></div>
    </div>
  </div>
</div>

<script>
let qinTimer = null;
let lastQin = {qin:null,qpl:null};
function setButtons(r){document.getElementById('btnStart').disabled=r;document.getElementById('btnStop').disabled=!r;}
function connect(){document.getElementById('indicator').textContent='REST';document.getElementById('indicator').className='';}
async function fetchFallback(){try{const r=await fetch('/data');const d=await r.json();if(d&&d.rows)renderAll(d);}catch(e){}}
async function fetchQin(){try{const r=await fetch('/qinflow');const d=await r.json();if(d&&d.ok){lastQin={qin:d.qin||{},qpl:d.qpl||{}};renderQin(lastQin);}}catch(e){}}
function fmtM(v){v=Number(v||0);if(v>=1e6)return(v/1e6).toFixed(2)+'M';if(v>=1e3)return(v/1e3).toFixed(1)+'K';return Math.round(v).toString();}
function renderTopPanel(id,arr,fn){const el=document.getElementById(id);if(!el)return;el.innerHTML=arr&&arr.length?arr.map(fn).join(''):'<div style="color:var(--sub);font-size:11px;padding:8px 0">No data</div>';}
function renderAll(d){
  document.getElementById('status').textContent=d.status||'';
  setButtons(!!d.running);
  const ri=d.raceinfo||{};
  document.getElementById('race-info').innerHTML=`<span>Race <span class="strong">${ri.racename||''}</span></span><span class="strong">${ri.racetime||''}</span><span>${ri.distance||''} ${ri.track||''}</span><span>${ri.course||''}</span><span>${ri.raceclass||''}</span><span>${ri.going||''}</span>`;
  document.getElementById('pool-bar').innerHTML=`<span>WIN Pool: <span class="blue">${d.winpool||''}</span></span><span>Last Update: <b>${d.lastupdate||''}</b></span><span>Base Time: <b>${d.basetime||''}</b></span><span>Updates: <b>${d.updatecount||0}</b></span>`;
  const rows=d.rows||[];
  document.getElementById('main-body').innerHTML=rows.map(r=>{
    const winbig=Number(r.win_big ?? r.winBig ?? 0);
    const bigLabel=r.win_big_label || (winbig>=100000?'>=100k':winbig>10000?'10k~100k':winbig>0?'<=10k':'');
    return `<tr><td style="font-weight:700;color:var(--blue)">${r.no||''}</td><td class="left">${r.name||''}</td><td>${r.barrier||''}</td><td class="left">${r.jockey||''}</td><td class="left">${r.trainer||''}</td><td class="win-big">${r.win||''}</td><td>${r.place||''}</td><td style="color:var(--sub)">${bigLabel}</td><td style="color:var(--sub)">${r.estbet||''}</td><td style="font-size:11px">${r.alert||''}</td></tr>`;
  }).join('');
  const winRows=rows.filter(r=>Number(r.win_big ?? r.winBig ?? 0)>0).sort((a,b)=>Number(b.win_big ?? b.winBig ?? 0)-Number(a.win_big ?? a.winBig ?? 0)).slice(0,8).map(r=>({no:r.no,name:r.name,flow:r.win_big_label||(Number(r.win_big ?? r.winBig ?? 0)>=100000?'>=100k':Number(r.win_big ?? r.winBig ?? 0)>10000?'10k~100k':'<=10k')}));
  renderTopPanel('top-win',winRows,r=>`<div class="top-row"><span class="top-no">${r.no}</span><span class="top-name">${r.name}</span><span class="top-score">${r.flow}</span></div>`);
  renderTopPanel('top-sms-main',d.topdown||[],r=>`<div class="top-row"><span class="top-no">${r.no}</span><span class="top-name">${r.name}</span><span class="top-score">${r.sms?.toFixed?r.sms.toFixed(1):r.sms||''}</span></div>`);
  renderTopPanel('top-acc-main',d.topacc||[],r=>`<div class="top-row"><span class="top-no">${r.no}</span><span class="top-name">${r.name}</span><span class="top-score">${r.acc?.toFixed?r.acc.toFixed(1):r.acc||''}</span></div>`);
  renderTopPanel('top-sms',d.topdown||[],r=>`<div class="top-row"><span class="top-no">${r.no}</span><span class="top-name">${r.name}</span><span class="top-score">${r.sms?.toFixed?r.sms.toFixed(1):r.sms||''}</span></div>`);
  renderTopPanel('top-acc',d.topacc||[],r=>`<div class="top-row"><span class="top-no">${r.no}</span><span class="top-name">${r.name}</span><span class="top-score">${r.acc?.toFixed?r.acc.toFixed(1):r.acc||''}</span></div>`);
}
function renderQin(obj){
  const qin=(obj&&obj.qin)||{}; const qpl=(obj&&obj.qpl)||{};
  const renderList=(items,elId)=>{const el=document.getElementById(elId);if(!el)return;el.innerHTML=(items&&items.length)?items.map(x=>`<div class="qflow-item"><span>${x.time||''} <b>${x.combo||''}</b></span><span>${x.odds||''}</span><span>${fmtM(x.flow||x.investment||0)}</span></div>`).join(''):'<div style="color:var(--sub);font-size:11px;padding:8px 0">No data</div>';};
  renderList(qin.r||[],'qin-r2'); renderList(qin.o||[],'qin-o2'); renderList(qin.y||[],'qin-y2');
  renderList(qpl.r||[],'qpl-r2'); renderList(qpl.o||[],'qpl-o2'); renderList(qpl.y||[],'qpl-y2');
  renderList(qin.r||[],'qin-big'); renderList(qpl.r||[],'qpl-big');
}
function showTab(name,el){['main','top','qin'].forEach(t=>document.getElementById('tab-'+t).style.display=t===name?'':'none');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');if(name==='qin'){renderQin(lastQin);fetchQin();startQinTimer()}else if(qinTimer){clearInterval(qinTimer);qinTimer=null;}}
function startQinTimer(){if(qinTimer)clearInterval(qinTimer);qinTimer=setInterval(fetchQin,2000)}
async function startMonitor(){await fetch('/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:document.getElementById('iDate').value||new Date().toISOString().slice(0,10),venue:document.getElementById('iVenue').value,raceno:document.getElementById('iRace').value,interval:1})});await fetchFallback();}
async function stopMonitor(){await fetch('/stop',{method:'POST'});setButtons(false)}
document.getElementById('iDate').value=new Date().toISOString().slice(0,10);
connect();
setInterval(fetchFallback,5000);
</script>
</body>
</html>
