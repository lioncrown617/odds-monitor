<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏇 HKJC 賠率監察</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; }
  header { background: #161b22; border-bottom: 2px solid #f0c040; padding: 14px 24px;
           display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 18px; color: #f0c040; }
  #status-badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; background: #21262d; border: 1px solid #30363d; }
  #status-badge.running { border-color: #238636; color: #3fb950; }
  #status-badge.stopped { border-color: #da3633; color: #f85149; }
  .container { max-width: 1800px; margin: 0 auto; padding: 16px; }
  .config-panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
                  padding: 16px 20px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .config-panel label { display: block; color: #8b949e; font-size: 11px; margin-bottom: 4px; }
  .config-panel input, .config-panel select { background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
    padding: 7px 10px; border-radius: 6px; font-size: 13px; width: 100%; }
  .field { min-width: 130px; }
  .btn { padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-start { background: #238636; color: #fff; } .btn-start:hover { background: #2ea043; }
  .btn-stop  { background: #da3633; color: #fff; } .btn-stop:hover  { background: #f85149; }
  .info-bar { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .info-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px;
               padding: 8px 14px; flex: 1; min-width: 120px; }
  .info-card .label { color: #8b949e; font-size: 11px; }
  .info-card .value { font-size: 14px; font-weight: 600; color: #f0c040; margin-top: 2px; }
  .pool-card { background: #1a1a00; border: 1px solid #f0c040; border-radius: 6px;
               padding: 8px 16px; flex: 2; min-width: 200px; }
  .pool-card .label { color: #f0c040; font-size: 11px; }
  .pool-card .value { font-size: 22px; font-weight: 700; color: #ffe066; margin-top: 2px; }
  .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #161b22; padding: 8px 10px; text-align: left;
             border-bottom: 2px solid #30363d; color: #8b949e; font-size: 11px; white-space: nowrap; }
  thead th.win-col  { color: #f0c040; }
  thead th.bet-col  { color: #58a6ff; }
  thead th.flow-col { color: #3fb950; border-left: 1px solid #30363d; }
  thead th.flow-col-h { color: #3fb950; }
  .flow-sep { border-left: 2px solid #238636 !important; }
  tbody tr { border-bottom: 1px solid #21262d; transition: background 0.2s; cursor: pointer; }
  tbody tr:hover { background: #1c2128; }
  tbody td { padding: 7px 10px; white-space: nowrap; font-size: 12px; }
  tbody td.flow-sep { border-left: 2px solid #238636; }
  tr.hot  { background: rgba(248,81,73,0.08); }
  tr.warm { background: rgba(210,153,34,0.08); }
  tr.rise { background: rgba(63,185,80,0.08); }
  .badge { padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.hot    { background: rgba(248,81,73,0.2);  color: #f85149; }
  .badge.warm   { background: rgba(210,153,34,0.2); color: #d29922; }
  .badge.rise   { background: rgba(63,185,80,0.2);  color: #3fb950; }
  .badge.neutral{ color: #484f58; }
  .chg-down { color: #f85149; }
  .chg-up   { color: #3fb950; }
  .up      { color: #3fb950; font-weight: 600; }
  .down    { color: #f85149; font-weight: 600; }
  .neutral { color: #484f58; }
  .base-win { color: #8b949e; }
  .curr-win { font-weight: 700; font-size: 15px; }
  .color-dot { display: inline-block; width: 10px; height: 10px;
               border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  /* 熱錢警示行 */
  tr.hotmoney { background: rgba(63,185,80,0.12) !important; }
  tr.hotmoney td.flow-sep { border-left: 2px solid #3fb950; }

  .chart-section { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
                   padding: 16px; margin-bottom: 14px; }
  .chart-section h3 { color: #e6edf3; font-size: 14px; margin-bottom: 8px; }
  .chart-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab-btn { padding: 5px 14px; border-radius: 6px; border: 1px solid #30363d;
             background: #21262d; color: #8b949e; cursor: pointer; font-size: 12px; }
  .tab-btn.active { background: #f0c04022; border-color: #f0c040; color: #f0c040; font-weight: 700; }
  .chart-controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .horse-btn { padding: 4px 10px; border-radius: 12px; border: 1px solid #30363d;
               background: #21262d; color: #8b949e; cursor: pointer; font-size: 12px; transition: all 0.2s; }
  .horse-btn.active { font-weight: 700; }
  .chart-wrap { position: relative; height: 380px; }
  .chart-hint { font-size: 11px; color: #484f58; margin-top: 8px; }
  .picks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width:700px) { .picks-grid { grid-template-columns: 1fr; } }
  .picks-panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
  .picks-panel h3 { font-size: 13px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #30363d; }
  .picks-panel.down h3 { color: #f85149; }
  .picks-panel.up   h3 { color: #3fb950; }
  .pick-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #21262d; }
  .pick-item:last-child { border-bottom: none; }
  .medal { font-size: 18px; }
  .pick-name { font-weight: 600; font-size: 13px; }
  .pick-no   { font-size: 11px; color: #8b949e; }
  .pick-stats { margin-left: auto; text-align: right; font-size: 11px; color: #8b949e; }
  .pick-win  { font-size: 17px; font-weight: 700; }
  .pick-win.down { color: #f85149; }
  .pick-win.up   { color: #3fb950; }
  .base-note { font-size: 11px; color: #484f58; margin-bottom: 6px; }
  .legend-bar { display:flex; gap:16px; font-size:11px; margin-bottom:8px; flex-wrap:wrap; }
  .legend-bar span { display:flex; align-items:center; gap:4px; }
</style>
</head>
<body>
<header>
  <h1>🏇 HKJC 即時賠率監察</h1>
  <span id="status-badge" class="stopped">● 未啟動</span>
</header>
<div class="container">

  <div class="config-panel">
    <div class="field"><label>📅 賽馬日期</label><input type="date" id="inp-date"></div>
    <div class="field"><label>🏟 場地</label>
      <select id="inp-venue">
        <option value="ST">ST - 沙田</option>
        <option value="HV">HV - 跑馬地</option>
      </select>
    </div>
    <div class="field" style="min-width:90px"><label>🔢 場次</label>
      <input type="number" id="inp-race" min="1" max="12" value="1"></div>
    <div class="field" style="min-width:110px"><label>⏱ 間隔(秒)</label>
      <input type="number" id="inp-interval" min="15" max="300" value="30"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-start" onclick="startMonitor()">▶ 開始監察</button>
      <button class="btn btn-stop"  onclick="stopMonitor()">■ 停止</button>
    </div>
  </div>

  <div class="info-bar">
    <div class="info-card"><div class="label">場次</div><div class="value" id="info-race">—</div></div>
    <div class="info-card"><div class="label">更新次數</div><div class="value" id="info-count">—</div></div>
    <div class="info-card"><div class="label">最後更新</div><div class="value" id="info-time">—</div></div>
    <div class="info-card"><div class="label">基準時間</div><div class="value" id="info-base">—</div></div>
    <div class="pool-card">
      <div class="label">💰 獨贏彩池總投注額（實時）</div>
      <div class="value" id="info-pool">—</div>
    </div>
    <div class="info-card"><div class="label">狀態</div><div class="value" id="info-status" style="font-size:12px">等待中</div></div>
  </div>

  <div class="legend-bar">
    <span style="color:#f0c040">⭐ 獨贏賠率欄</span>
    <span style="color:#58a6ff">💧 投注額欄</span>
    <span style="color:#3fb950">🔥 熱錢流入欄（綠色分隔線）</span>
    <span style="background:rgba(63,185,80,0.12);padding:2px 6px;border-radius:4px;color:#3fb950">
      整行綠色 = 連續3次或以上流入</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>色</th><th>馬號</th><th>馬名</th><th>檔</th><th>騎師</th><th>練馬師</th>
          <th class="win-col">基準賠</th>
          <th class="win-col">⭐ WIN</th>
          <th class="win-col">賠率變動</th>
          <th class="win-col">走勢</th>
          <th class="bet-col">基準投注</th>
          <th class="bet-col">現時投注</th>
          <th class="bet-col">佔池%</th>
          <th class="bet-col">累積增減</th>
          <th class="flow-col flow-sep">🔥本次流入</th>
          <th class="flow-col-h">流入加速</th>
          <th class="flow-col-h">連續次數</th>
        </tr>
      </thead>
      <tbody id="odds-tbody">
        <tr><td colspan="17" style="text-align:center;padding:30px;color:#484f58">請設定場次後按「開始監察」</td></tr>
      </tbody>
    </table>
  </div>

  <div class="chart-section">
    <h3>📈 走勢圖</h3>
    <div class="chart-tabs">
      <button class="tab-btn active" onclick="switchTab('odds',this)">獨贏賠率</button>
      <button class="tab-btn"        onclick="switchTab('bet', this)">💰 估算投注額</button>
      <button class="tab-btn"        onclick="switchTab('flow',this)">🔥 每次流入金額</button>
    </div>
    <div class="chart-controls" id="horse-btns"></div>
    <div class="chart-wrap"><canvas id="oddsChart"></canvas></div>
    <p class="chart-hint">💡 流入金額圖：正值=資金流入，負值=資金流出，可看出哪個時段大額湧入</p>
  </div>

  <div class="picks-grid">
    <div class="picks-panel down">
      <h3>📉 資金持續流入（落飛）頭三位</h3>
      <div id="picks-down"><p style="color:#484f58;font-size:12px">等待數據...</p></div>
    </div>
    <div class="picks-panel up">
      <h3>📈 賠率持續回升（冷門）頭三位</h3>
      <div id="picks-up"><p style="color:#484f58;font-size:12px">等待數據...</p></div>
    </div>
  </div>
</div>

<script>
document.getElementById("inp-date").value = new Date().toISOString().slice(0,10);

let pollTimer      = null;
let oddsChart      = null;
let allHistory     = {};
let allBetHistory  = {};
let allFlowHistory = {};
let allNames       = {};
let allTimestamps  = [];
let activeHorses   = new Set();
let currentTab     = "odds";
const medals = ["🥇","🥈","🥉"];

const COLOR_POOL = [
  "#f0c040","#58a6ff","#f85149","#3fb950","#bc8cff",
  "#ff9f43","#00d2d3","#ff6b9d","#48dbfb","#1dd1a1",
  "#ffeaa7","#fd79a8","#a29bfe","#55efc4","#e17055"
];
const horseColorMap = {};
function getHorseColor(no) {
  if (!horseColorMap[no])
    horseColorMap[no] = COLOR_POOL[Object.keys(horseColorMap).length % COLOR_POOL.length];
  return horseColorMap[no];
}
function hexAlpha(hex, alpha) {
  if (alpha >= 1) return hex;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function fmtMoney(v) {
  if (v == null) return "—";
  const a = Math.abs(v);
  const s = v < 0 ? "-" : "+";
  if (a>=1000000) return `${s}$${(a/1000000).toFixed(2)}M`;
  if (a>=1000)    return `${s}$${(a/1000).toFixed(0)}K`;
  return `${s}$${a}`;
}

// ── Chart ─────────────────────────────────────────────
function initChart() {
  Chart.register(ChartDataLabels);
  const ctx = document.getElementById("oddsChart").getContext("2d");
  oddsChart = new Chart(ctx, {
    type: "line",
    data: { labels: [], datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 400 },
      interaction: { mode: "index", intersect: false },
      layout: { padding: { right: 70 } },
      plugins: {
        datalabels: {
          display: (ctx) => {
            const data = ctx.dataset.data;
            let last=-1;
            for(let i=data.length-1;i>=0;i--){if(data[i]!=null){last=i;break;}}
            return ctx.dataIndex===last && !ctx.dataset.hidden;
          },
          align:"right", anchor:"end",
          color: ctx => ctx.dataset.borderColor,
          font:  { size:11, weight:"bold" },
          formatter: (v) => {
            if (v==null) return "";
            if (currentTab==="odds") return `${v}`;
            return fmtMoney(v).replace("+","");
          },
          padding: { left:4 },
        },
        legend: {
          labels: {
            color:"#8b949e", font:{size:11}, boxWidth:14,
            usePointStyle:true, pointStyle:"circle",
            generateLabels: chart => chart.data.datasets.map((ds,i)=>({
              text:ds.label, fillStyle:ds.borderColor, strokeStyle:ds.borderColor,
              lineWidth:2, hidden:ds.hidden, index:i, datasetIndex:i, pointStyle:"circle",
            }))
          }
        },
        tooltip: {
          backgroundColor:"#161b22", borderColor:"#30363d", borderWidth:1,
          titleColor:"#e6edf3", bodyColor:"#8b949e",
          callbacks: {
            title: items => `🕐 ${items[0].label}`,
            label: ctx => {
              const v=ctx.parsed.y;
              if (currentTab==="odds") return ` 馬號${ctx.dataset.label}  賠率：${v??"—"}`;
              return ` 馬號${ctx.dataset.label}  ${currentTab==="bet"?"投注":"流入"}：${fmtMoney(v)}`;
            },
            labelColor: ctx => ({borderColor:ctx.dataset.borderColor,backgroundColor:ctx.dataset.borderColor})
          }
        }
      },
      scales: {
        x: { ticks:{color:"#8b949e",font:{size:10},maxRotation:45}, grid:{color:"#21262d"} },
        y: {
          reverse: false,
          ticks:  {color:"#8b949e",font:{size:11}},
          grid:   {color:"#21262d"},
          title:  {display:true, text:"獨贏賠率（低＝熱門）", color:"#8b949e", font:{size:11}}
        }
      }
    }
  });
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  const yAxis = oddsChart.options.scales.y;
  if (tab==="odds") {
    yAxis.reverse=true;  yAxis.title.text="獨贏賠率（低＝熱門）";
  } else if (tab==="bet") {
    yAxis.reverse=false; yAxis.title.text="估算投注額";
  } else {
    yAxis.reverse=false; yAxis.title.text="每次流入金額（正=流入 負=流出）";
  }
  updateChart();
}

function updateChart() {
  if (!oddsChart) return;
  const src = currentTab==="odds"?allHistory:currentTab==="bet"?allBetHistory:allFlowHistory;
  const horses = Object.keys(src);
  if (!horses.length) return;
  oddsChart.data.labels = allTimestamps;
  const hasActive = activeHorses.size > 0;
  oddsChart.data.datasets = horses.map(no => {
    const color=getHorseColor(no);
    const isH=activeHorses.has(no);
    const isA=!hasActive||isH;
    const alpha=hasActive&&!isH?0.1:1;
    return {
      label:                no+" "+(allNames[no]||""),
      data:                 src[no],
      borderColor:          hexAlpha(color,alpha),
      backgroundColor:      hexAlpha(color,alpha*0.08),
      pointBackgroundColor: hexAlpha(color,alpha),
      pointBorderColor:     isH?"#fff":hexAlpha(color,alpha),
      pointBorderWidth:     isH?1.5:0,
      borderWidth:          isH?3:1.5,
      pointRadius:          isH?5:2,
      tension:              0.35,
      hidden:               !isA,
      spanGaps:             true,
    };
  });
  oddsChart.update("active");
}

function buildHorseBtns(horses) {
  const wrap=document.getElementById("horse-btns");
  if(wrap.children.length===Object.keys(horses).length+1) return;
  wrap.innerHTML="";
  const ab=document.createElement("button");
  ab.className="horse-btn active"; ab.textContent="全部";
  ab.style.cssText="border-color:#8b949e;color:#e6edf3;background:#30363d";
  ab.onclick=()=>toggleAll(ab); wrap.appendChild(ab);
  Object.entries(horses).forEach(([no,name])=>{
    const color=getHorseColor(no);
    const btn=document.createElement("button");
    btn.className="horse-btn"; btn.dataset.no=no;
    btn.textContent=`${no} ${name}`;
    btn.style.cssText=`border-color:${color};color:${color}`;
    btn.onclick=()=>toggleHorse(no,btn,color);
    wrap.appendChild(btn);
  });
}
function toggleAll(btn) {
  activeHorses.clear();
  document.querySelectorAll(".horse-btn").forEach(b=>{b.classList.remove("active");b.style.background="";});
  btn.classList.add("active"); btn.style.background="#30363d"; updateChart();
}
function toggleHorse(no,btn,color) {
  const ab=document.querySelector(".horse-btn:first-child");
  ab.classList.remove("active"); ab.style.background="";
  if(activeHorses.has(no)){activeHorses.delete(no);btn.classList.remove("active");btn.style.background="";}
  else{activeHorses.add(no);btn.classList.add("active");btn.style.background=color+"33";}
  if(activeHorses.size===0) toggleAll(ab); else updateChart();
}

// ── API ───────────────────────────────────────────────
function startMonitor() {
  const payload={
    date:document.getElementById("inp-date").value,
    venue:document.getElementById("inp-venue").value,
    race_no:document.getElementById("inp-race").value,
    interval:document.getElementById("inp-interval").value,
  };
  fetch("/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(r=>r.json()).then(d=>{
      if(d.ok){
        setStatus(true); activeHorses.clear();
        Object.keys(horseColorMap).forEach(k=>delete horseColorMap[k]);
        if(!oddsChart) initChart();
        else{oddsChart.data.labels=[];oddsChart.data.datasets=[];oddsChart.update();}
        startPolling(parseInt(payload.interval)*1000);
      } else { alert(d.msg); }
    });
}
function stopMonitor() {
  fetch("/stop",{method:"POST"}).then(()=>{setStatus(false);if(pollTimer)clearInterval(pollTimer);});
}
function setStatus(r){
  const b=document.getElementById("status-badge");
  b.textContent=r?"● 監察中":"● 已停止"; b.className=r?"running":"stopped";
}
function startPolling(ms){
  if(pollTimer) clearInterval(pollTimer);
  fetchData(); pollTimer=setInterval(fetchData,ms);
}
function fetchData(){fetch("/data").then(r=>r.json()).then(renderAll);}

function renderAll(d) {
  document.getElementById("info-race").textContent   = d.race_date?`${d.race_date} ${d.venue_name} 第${d.race_no}場`:"—";
  document.getElementById("info-count").textContent  = d.update_count||"—";
  document.getElementById("info-time").textContent   = d.last_update||"—";
  document.getElementById("info-base").textContent   = d.base_time||"—";
  document.getElementById("info-pool").textContent   = d.win_pool||"—";
  document.getElementById("info-status").textContent = d.status||"—";
  setStatus(d.running);

  const tbody=document.getElementById("odds-tbody");
  if(!d.rows||!d.rows.length){
    tbody.innerHTML=`<tr><td colspan="17" style="text-align:center;padding:30px;color:#484f58">${d.status}</td></tr>`;
  } else {
    tbody.innerHTML=d.rows.map(r=>{
      const color=getHorseColor(r.no);
      const chgClass=r.chg.startsWith("+")?"chg-up":r.chg.startsWith("-")?"chg-down":"";
      const badge=r.trend==="—"
        ?`<span class="badge neutral">—</span>`
        :`<span class="badge ${r.trend_css}">${
          r.trend==="急跌"?"🔴 急跌":r.trend==="持跌"?"🟡 持跌":
          r.trend==="持升"?"🟢 持升":"🟢 回升"}</span>`;
      // 連續3次流入高亮整行
      const rowClass=r.streak_css==="up"&&r.streak.includes("🔥")?"hotmoney "+r.trend_css:r.trend_css;
      return `<tr class="${rowClass}" onclick="highlightHorse('${r.no}')">
        <td><span class="color-dot" style="background:${color}"></span></td>
        <td><b style="color:${color}">${r.no}</b></td>
        <td>${r.name}</td><td>${r.draw}</td>
        <td>${r.jockey}</td><td>${r.trainer}</td>
        <td class="base-win">${r.base_win}</td>
        <td class="curr-win" style="color:${color}">${r.win}</td>
        <td class="${chgClass}">${r.chg}</td>
        <td>${badge}</td>
        <td style="color:#8b949e">${r.base_bet}</td>
        <td style="color:${color};font-weight:600">${r.est_bet}</td>
        <td style="color:#8b949e;font-size:11px">${r.est_pct}</td>
        <td class="${r.cum_diff_css}" style="font-size:12px">${r.cum_diff} ${r.cum_diff_pct}</td>
        <td class="${r.flow_css} flow-sep">${r.flow}</td>
        <td class="${r.accel_css}">${r.accel}</td>
        <td class="${r.streak_css}">${r.streak}</td>
      </tr>`;
    }).join("");
  }

  if(d.history&&d.timestamps){
    allHistory     = d.history;
    allBetHistory  = d.bet_history||{};
    allFlowHistory = d.flow_history||{};
    allNames       = d.horses||{};
    allTimestamps  = d.timestamps;
    buildHorseBtns(allNames);
    updateChart();
  }

  document.getElementById("picks-down").innerHTML=d.top_down&&d.top_down.length
    ?d.top_down.map((h,i)=>`
        <div class="pick-item">
          <span class="medal">${medals[i]}</span>
          <div><div class="pick-name">${h.name}</div>
          <div class="pick-no">馬號${h.no} │ 基準:${h.base} │ 連跌:${h.streak}次 │ 累跌:${h.drop}%</div></div>
          <div class="pick-stats"><div class="pick-win down">${h.win}</div><div>現賠率</div></div>
        </div>`).join("")
    :`<p style="color:#484f58;font-size:12px">暫無數據...</p>`;

  document.getElementById("picks-up").innerHTML=d.top_up&&d.top_up.length
    ?d.top_up.map((h,i)=>`
        <div class="pick-item">
          <span class="medal">${medals[i]}</span>
          <div><div class="pick-name">${h.name}</div>
          <div class="pick-no">馬號${h.no} │ 基準:${h.base} │ 連升:${h.streak}次 │ 累升:${h.rise}%</div></div>
          <div class="pick-stats"><div class="pick-win up">${h.win}</div><div>現賠率</div></div>
        </div>`).join("")
    :`<p style="color:#484f58;font-size:12px">暫無數據...</p>`;
}

function highlightHorse(no){
  const btn=document.querySelector(`.horse-btn[data-no="${no}"]`);
  if(btn) btn.click();
}
</script>
</body>
</html>
